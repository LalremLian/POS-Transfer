name: pos_upload_download
description: "POS SaaS background file transfer — upload, download, foreground service"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4

  # File handling
  file_picker: ^8.3.7
  path_provider: ^2.1.5
  path: ^1.9.1
  mime: ^2.0.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Background execution
  flutter_foreground_task: ^8.16.0

  # Permissions
  permission_handler: ^11.4.0

  # Utilities
  logger: ^2.5.0
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.6
  equatable: ^2.0.7
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
